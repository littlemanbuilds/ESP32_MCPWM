; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = test/compile_smoke
lib_dir = ..

[env]
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+

; ESP32-S3 is the normal local reference target. The additional environments
; are one representative compile target per architecture claimed by library.properties.

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1
upload_speed = 921600
